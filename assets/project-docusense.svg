acity="0"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(0 .5 .5)"><stop offset="0" stop-color="#3ee0ff" stop-opacity=".9"/><stop offset=".35" stop-color="#4f8bff" stop-opacity="0"/><stop offset=".65" stop-color="#4f8bff" stop-opacity="0"/><stop offset="1" stop-color="#4f8bff" stop-opacity=".7"/><animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="9s" repeatCount="indefinite"/></linearGradient><radialGradient id="halo"><stop offset="0" stop-color="#3ee0ff" stop-opacity=".09"/><stop offset="1" stop-color="#3ee0ff" stop-opacity="0"/></radialGradient></defs><rect x=".5" y=".5" width="1199" height="399" rx="24" fill="#080c16" stroke="rgba(148,170,210,0.14)"/><ellipse cx="908" cy="80" rx="380" ry="220" fill="url(#halo)"/><rect class="smil" x=".75" y=".75" width="1198.5" height="398.5" rx="23.5" fill="none" stroke="url(#edge)" stroke-width="1.5"/><rect x="24" y="24" width="600" height="352" rx="16" fill="#04060b" stroke="rgba(148,170,210,0.26)"/><path d="M24 60H624" stroke="rgba(148,170,210,0.14)"/><circle cx="44" cy="42" r="5" fill="#ff5f57" opacity=".85"/><circle cx="60" cy="42" r="5" fill="#febc2e" opacity=".85"/><circle cx="76" cy="42" r="5" fill="#28c840" opacity=".85"/><text class="mono " x="244.8" y="46.0" font-size="12" fill="#7f8ca2" textLength="158.4" lengthAdjust="spacing" xml:space="preserve" >bash  —  docusense-rag</text><g class="lnd0"><text class="mono " x="44.0" y="90.0" font-size="12" fill="#4ade80" textLength="14.4" lengthAdjust="spacing" xml:space="preserve" >$ </text><text class="mono " x="58.4" y="90.0" font-size="12" fill="#a7b4c8" textLength="302.4" lengthAdjust="spacing" xml:space="preserve" >curl -s -X POST localhost:8000/api/query \</text></g><g class="lnd1"><text class="mono " x="44.0" y="111.0" font-size="12" fill="#a7b4c8" textLength="50.4" lengthAdjust="spacing" xml:space="preserve" >    -H </text><text class="mono " x="94.4" y="111.0" font-size="12" fill="#c3d3ea" textLength="230.4" lengthAdjust="spacing" xml:space="preserve" >&quot;Content-Type: application/json&quot;</text><text class="mono " x="324.8" y="111.0" font-size="12" fill="#a7b4c8" textLength="14.4" lengthAdjust="spacing" xml:space="preserve" > \</text></g><g class="lnd2"><text class="mono " x="44.0" y="132.0" font-size="12" fill="#a7b4c8" textLength="50.4" lengthAdjust="spacing" xml:space="preserve" >    -d </text><text class="mono " x="94.4" y="132.0" font-size="12" fill="#c3d3ea" textLength="324.0" lengthAdjust="spacing" xml:space="preserve" >&#x27;{&quot;question&quot;: &quot;What is the policy on database</text></g><g class="lnd3"><text class="mono " x="44.0" y="153.0" font-size="12" fill="#c3d3ea" textLength="273.6" lengthAdjust="spacing" xml:space="preserve" >          backup retention periods?&quot;}&#x27;</text></g><g class="lnd4"><text class="mono " x="44.0" y="174.0" font-size="12" fill="#a7b4c8" textLength="7.2" lengthAdjust="spacing" xml:space="preserve" >{</text></g><g class="lnd5"><text class="mono " x="44.0" y="195.0" font-size="12" fill="#3ee0ff" textLength="72.0" lengthAdjust="spacing" xml:space="preserve" >  &quot;answer&quot;</text><text class="mono " x="116.0" y="195.0" font-size="12" fill="#a7b4c8" textLength="14.4" lengthAdjust="spacing" xml:space="preserve" >: </text><text class="mono " x="130.4" y="195.0" font-size="12" fill="#c3d3ea" textLength="302.4" lengthAdjust="spacing" xml:space="preserve" >&quot;All primary database backups are retained</text></g><g class="lnd6"><text class="mono " x="44.0" y="216.0" font-size="12" fill="#c3d3ea" textLength="424.8" lengthAdjust="spacing" xml:space="preserve" >             for a rolling period of 30 calendar days. ...&quot;</text><text class="mono " x="468.8" y="216.0" font-size="12" fill="#a7b4c8" textLength="7.2" lengthAdjust="spacing" xml:space="preserve" >,</text></g><g class="lnd7"><text class="mono " x="44.0" y="237.0" font-size="12" fill="#3ee0ff" textLength="79.2" lengthAdjust="spacing" xml:space="preserve" >  &quot;sources&quot;</text><text class="mono " x="123.2" y="237.0" font-size="12" fill="#a7b4c8" textLength="36.0" lengthAdjust="spacing" xml:space="preserve" >: [{ </text><text class="mono " x="159.2" y="237.0" font-size="12" fill="#3ee0ff" textLength="72.0" lengthAdjust="spacing" xml:space="preserve" >&quot;chunk_id&quot;</text><text class="mono " x="231.2" y="237.0" font-size="12" fill="#a7b4c8" textLength="14.4" lengthAdjust="spacing" xml:space="preserve" >: </text><text class="mono " x="245.6" y="237.0" font-size="12" fill="#c3d3ea" textLength="72.0" lengthAdjust="spacing" xml:space="preserve" >&quot;chunk_04&quot;</text><text class="mono " x="317.6" y="237.0" font-size="12" fill="#a7b4c8" textLength="14.4" lengthAdjust="spacing" xml:space="preserve" >, </text><text class="mono " x="332.0" y="237.0" font-size="12" fill="#3ee0ff" textLength="129.6" lengthAdjust="spacing" xml:space="preserve" >&quot;similarity_score&quot;</text><text class="mono " x="461.6" y="237.0" font-size="12" fill="#a7b4c8" textLength="14.4" lengthAdjust="spacing" xml:space="preserve" >: </text><text class="mono " x="476.0" y="237.0" font-size="12" fill="#4f8bff" textLength="28.8" lengthAdjust="spacing" xml:space="preserve" >0.87</text><text class="mono " x="504.8" y="237.0" font-size="12" fill="#a7b4c8" textLength="28.8" lengthAdjust="spacing" xml:space="preserve" > }],</text></g><g class="lnd8"><text class="mono " x="44.0" y="258.0" font-size="12" fill="#3ee0ff" textLength="108.0" lengthAdjust="spacing" xml:space="preserve" >  &quot;tokens_used&quot;</text><text class="mono " x="152.0" y="258.0" font-size="12" fill="#a7b4c8" textLength="14.4" lengthAdjust="spacing" xml:space="preserve" >: </text><text class="mono " x="166.4" y="258.0" font-size="12" fill="#4f8bff" textLength="7.2" lengthAdjust="spacing" xml:space="preserve" >0</text></g><g class="lnd9"><text class="mono " x="44.0" y="279.0" font-size="12" fill="#a7b4c8" textLength="7.2" lengthAdjust="spacing" xml:space="preserve" >}</text></g><g class="lnd10"><text class="mono " x="44.0" y="300.0" font-size="12" fill="#a7b4c8" textLength="0.0" lengthAdjust="spacing" xml:space="preserve" ></text></g><g class="lnd11"><text class="mono " x="44.0" y="321.0" font-size="12" fill="#7f8ca2" textLength="424.8" lengthAdjust="spacing" xml:space="preserve" ># not in the docs? one fixed fallback sentence, no guessing</text></g><rect class="blink" x="44" y="331" width="8" height="15" fill="#3ee0ff"/><g transform="translate(0 70.0)"><text class="mono " x="668.0" y="0.0" font-size="12.5" fill="#3ee0ff" textLength="399.5" lengthAdjust="spacing" xml:space="preserve" >01  /  APPLIED AI · GROUNDED RAG SERVICE · 2026</text><text class="sans" x="666" y="50" font-size="38" font-weight="600" letter-spacing="-1" fill="#e8eef8">DocuSense RAG</text><text class="sans" x="668" y="90" font-size="18" fill="#a7b4c8">A FastAPI microservice that answers questions only</text><text class="sans" x="668" y="117" font-size="18" fill="#a7b4c8">from internal documentation, and returns one fixed</text><text class="sans" x="668" y="144" font-size="18" fill="#a7b4c8">fallback sentence when the answer is not there.</text><path d="M668 180h12m-4-4 4 4-4 4" fill="none" stroke="#3ee0ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text class="sans" x="690" y="185" font-size="15.5" fill="#7f8ca2">Injection screen, similarity gate and citation checks</text><path d="M668 207h12m-4-4 4 4-4 4" fill="none" stroke="#3ee0ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text class="sans" x="690" y="212" font-size="15.5" fill="#7f8ca2">106 tests, golden-set evaluation, Docker CI</text><g class="chip" style="animation-delay:1.50s"><rect x="668.0" y="243.0" width="72.8" height="30" rx="15.0"/><text class="mono " x="681.0" y="262.7" font-size="13" fill="#a7b4c8" textLength="46.8" lengthAdjust="spacing" xml:space="preserve" >Python</text></g><g class="chip" style="animation-delay:1.64s"><rect x="748.8" y="243.0" width="80.6" height="30" rx="15.0"/><text class="mono " x="761.8" y="262.7" font-size="13" fill="#a7b4c8" textLength="54.6" lengthAdjust="spacing" xml:space="preserve" >FastAPI</text></g><g class="chip" style="animation-delay:1.78s"><rect x="837.4" y="243.0" width="65.0" height="30" rx="15.0"/><text class="mono " x="850.4" y="262.7" font-size="13" fill="#a7b4c8" textLength="39.0" lengthAdjust="spacing" xml:space="preserve" >FAISS</text></g><g class="chip" style="animation-delay:1.92s"><rect x="910.4" y="243.0" width="104.0" height="30" rx="15.0"/><text class="mono " x="923.4" y="262.7" font-size="13" fill="#a7b4c8" textLength="78.0" lengthAdjust="spacing" xml:space="preserve" >Claude API</text></g><g class="chip" style="animation-delay:2.06s"><rect x="1022.4" y="243.0" width="72.8" height="30" rx="15.0"/><text class="mono " x="1035.4" y="262.7" font-size="13" fill="#a7b4c8" textLength="46.8" lengthAdjust="spacing" xml:space="preserve" >Docker</text></g></g></svg>
