<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Tariful Hoque: Machine Learning, Explainable AI, Data Analysis" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#131c38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <style>
    .name { font: 700 52px 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 6px; fill: #f8fafc; opacity: 0; animation: rise 1s 0.2s forwards; }
    .sub  { font: 400 15px 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 1px; fill: #94a3b8; opacity: 0; animation: rise 1s 0.8s forwards; }
    .role { font: 400 22px Consolas, 'SFMono-Regular', Menlo, monospace; fill: #7dd3fc; opacity: 0; animation: cycle 9s infinite; }
    .r2 { animation-delay: 3s; }
    .r3 { animation-delay: 6s; }
    .bar  { transform-origin: 60px 0; animation: grow 1s 0s forwards; transform: scaleX(0); }
    .wave { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 3.5s 0.5s ease-out forwards; }
    @keyframes rise  { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes grow  { to { transform: scaleX(1); } }
    @keyframes draw  { to { stroke-dashoffset: 0; } }
    @keyframes cycle {
      0%   { opacity: 0; transform: translateY(8px); }
      5%, 28% { opacity: 1; transform: none; }
      33%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .name, .sub { opacity: 1; animation: none; }
      .r1 { opacity: 1; animation: none; }
      .bar { transform: none; animation: none; }
      .wave { stroke-dashoffset: 0; animation: none; }
    }
  </style>

  <rect width="1000" height="260" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="260" rx="14" fill="url(#grid)"/>

  <rect class="bar" x="60" y="52" width="64" height="3" rx="1.5" fill="url(#accent)"/>

  <text class="name" x="60" y="112">TARIFUL HOQUE</text>

  <text class="role r1" x="60" y="152">&gt; Machine Learning</text>
  <text class="role r2" x="60" y="152">&gt; Explainable AI</text>
  <text class="role r3" x="60" y="152">&gt; Data Analysis</text>

  <text class="sub" x="60" y="188">Computer Science Graduate  ·  Dhaka, Bangladesh</text>

  <path class="wave" d="M0 234 C 150 204, 250 250, 380 224 S 600 196, 720 228 S 900 246, 1000 210"
        fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.7"/>
  <circle r="4" fill="#38bdf8">
    <animateMotion dur="7s" begin="3.5s" repeatCount="indefinite"
      path="M0 234 C 150 204, 250 250, 380 224 S 600 196, 720 228 S 900 246, 1000 210"/>
  </circle>
</svg>
